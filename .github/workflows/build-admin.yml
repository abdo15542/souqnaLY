name: Build Admin APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android scaffolding in temp dir (never touches admin/lib)
        run: |
          rm -rf /tmp/admin_scaffold
          mkdir -p /tmp/admin_scaffold
          cd /tmp/admin_scaffold
          flutter create . --org com.abdo15542 --project-name souqna_admin --platforms=android

      - name: Copy only android/ into admin/
        run: |
          rm -rf admin/android
          cp -r /tmp/admin_scaffold/android admin/android

      - name: Pub get
        working-directory: admin
        run: flutter pub get

      - name: Build Admin APK
        working-directory: admin
        run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: souqna-admin-release-apk
          path: admin/build/app/outputs/flutter-apk/app-release.apk
