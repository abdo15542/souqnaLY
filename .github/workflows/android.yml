name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            tmp=$(mktemp -d)
            flutter create --project-name souqna_ly --org ly.souqna --platforms android "$tmp/scaffold"
            cp -R "$tmp/scaffold/android" ./android
            cp "$tmp/scaffold/.metadata" ./.metadata || true
            chmod +x android/gradlew || true
            rm -rf "$tmp"
          fi

      - name: Fix Manifest & Gradle
        run: |
          M=android/app/src/main/AndroidManifest.xml
          G=android/app/build.gradle.kts
          
          # Set Arabic Label
          sed -i 's/android:label="[^"]*"/android:label="سوقنا"/g' "$M"
          
          # Add Camera Permission for Barcode Scanner
          if ! grep -q "CAMERA" "$M"; then
             sed -i 's#</manifest>#  <uses-permission android:name="android.permission.CAMERA" />\n  <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$M"
          fi

          # Force Min SDK 21 (Required by mobile_scanner & pdf libs)
          if [ -f "$G" ]; then
             sed -i 's/minSdk\s*=\s*.*/minSdk = 21/' "$G"
          elif [ -f android/app/build.gradle ]; then
             sed -i 's/minSdkVersion\s*.*/minSdkVersion 21/' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: souqnaLY-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
