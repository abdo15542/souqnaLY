name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android platform
        run: |
          if [ ! -d android ]; then
            tmp=$(mktemp -d)
            flutter create --project-name souqna_ly --org ly.souqna --platforms android "$tmp/scaffold"
            cp -R "$tmp/scaffold/android" ./android
            rm -rf "$tmp"
          fi

      - name: Set Arabic app label
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if [ -f "$M" ]; then
            sed -i 's/android:label="[^"]*"/android:label="سوقنا"/g' "$M"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: souqnaLY-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
