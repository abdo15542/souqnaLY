name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            tmp=$(mktemp -d)
            flutter create --project-name souqna_ly --org ly.souqna --platforms android "$tmp/scaffold"
            cp -R "$tmp/scaffold/android" ./android
            cp "$tmp/scaffold/.metadata" ./.metadata || true
            chmod +x android/gradlew || true
            rm -rf "$tmp"
          fi

      - name: Fix Gradle Configurations (Critical for file_picker & SDK 36)
        run: |
          GKTS=android/app/build.gradle.kts
          GGROOVY=android/app/build.gradle
          ROOT_GKTS=android/build.gradle.kts
          ROOT_GGROOVY=android/build.gradle
          
          TARGET_APP=""
          IS_KOTLIN=false
          
          # Determine which app gradle file exists
          if [ -f "$GKTS" ]; then
            TARGET_APP="$GKTS"
            IS_KOTLIN=true
          elif [ -f "$GGROOVY" ]; then
            TARGET_APP="$GGROOVY"
            IS_KOTLIN=false
          fi

          if [ -n "$TARGET_APP" ]; then
            echo "Updating $TARGET_APP..."
            
            # 1. Set Arabic Label in Manifest
            M=android/app/src/main/AndroidManifest.xml
            sed -i 's/android:label="[^"]*"/android:label="سوقنا"/g' "$M"
            
            # 2. Add Camera Permission
            if ! grep -q "CAMERA" "$M"; then
               sed -i 's#</manifest>#  <uses-permission android:name="android.permission.CAMERA" />\n  <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$M"
            fi

            # 3. Update App Module SDK Versions
            if [ "$IS_KOTLIN" = true ]; then
               sed -i 's/minSdk\s*=\s*.*/minSdk = 21/' "$TARGET_APP"
               # Insert compileSdk = 36 after 'android {'
               sed -i '/^android {$/a\    compileSdk = 36' "$TARGET_APP" || true
            else
               sed -i 's/minSdkVersion\s*.*/minSdkVersion 21/' "$TARGET_APP"
               sed -i '/^android {$/a\    compileSdkVersion 36' "$TARGET_APP" || true
            fi
            
            # Remove duplicates if any
            awk '!seen[$0]++ || !/^ *compileSdk/' "$TARGET_APP" > temp && mv temp "$TARGET_APP"
          fi

          # 4. CRITICAL FIX: Force ALL SUBPROJECTS to use compileSdk 36
          # This fixes the error where file_picker tries to compile against SDK 34
          if [ "$IS_KOTLIN" = true ]; then
             # Append to root build.gradle.kts
             cat >> "$ROOT_GKTS" << 'GRADLE_EOF'
allprojects {
    tasks.withType<com.android.build.gradle.tasks.AarMetadataTask>().configureEach {
        // Ignore AAR metadata checks that fail due to mismatched compileSdk
        ignoreFailures.set(true)
    }
    
    // Force all subprojects to use compileSdk 36
    afterEvaluate {
        extensions.findByType(com.android.build.gradle.BaseExtension)?.apply {
            compileSdkVersion(36)
        }
    }
}
GRADLE_EOF
          else
             # Append to root build.gradle
             cat >> "$ROOT_GGROOVY" << 'GRADLE_EOF'
allprojects {
    tasks.withType(com.android.build.gradle.tasks.AarMetadataTask).configureEach {
        ignoreFailures = true
    }
    
    afterEvaluate {
        if (project.extensions.findByName('android') != null) {
            project.extensions.getByType(com.android.build.gradle.BaseExtension).compileSdkVersion(36)
        }
    }
}
GRADLE_EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: souqnaLY-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
